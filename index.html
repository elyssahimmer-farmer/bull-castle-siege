<script>
// The base of the Siege of the Bull Castle (from scene-studio/template, by way of the Gettysburg scene). Terrain and the
// moat basin, far hills, sky, the light through a day, haze, wind, the camera and steering (Fly and Soldier's eye),
// tapping people and places, the story panel, lamps, soft shadows, the siege's sound, and the plug-in API. The plug-ins
// build everything else, one file each (DESIGN.md 8). Sections marked EDIT are the ones each scene changes.
(function () {
  'use strict';

  // ---------- switches ----------
  // ?time=day|dusk|night holds the light (default: the 3-minute cycle). ?t0=seconds starts the clock there.
  // ?tour=1 glides between eight framed views. ?cam=x,y,z,tx,ty,tz pins the camera. ?res=0.75 renders at that
  // fraction of the screen's resolution (the Pi uses 0.75). ?shadows=1 turns on the sun's shadow map (off by default).
  // ?only=castle,people shows only those plug-ins (?only=none: the base alone). ?capture is for the video recorder.
  // ?view=eye&eye=x,z,yawDegrees starts in Soldier's eye there (yaw 0 faces south, 180 north). ?debug=siege draws the
  // SIEGE footprints (masonry, open passages, bridge decks) as lines, for builders. ?sound=0 mutes.
  const params = new URLSearchParams(location.search);
  const SHADOWS = params.get('shadows') === '1';
  const TOUR = params.get('tour') === '1';
  const TIME = params.get('time') || 'cycle';
  const CAM = params.has('cam') ? params.get('cam').split(',').map(Number) : null;
  const RES = Math.min(1, Number(params.get('res')) || 1);
  const ONLY = params.has('only') ? params.get('only').split(',') : null;
  const DEBUG = params.get('debug') || '';

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const rand = mulberry32(20261107);
  const rr = (a, b) => a + (b - a) * rand();
  const v = (x, y, z) => new THREE.Vector3(x, y, z);
  const TAU = Math.PI * 2;
  const clamp01 = (x) => Math.min(1, Math.max(0, x));
  const smooth01 = (x) => { const c = clamp01(x); return c * c * (3 - 2 * c); };
  const lerpN = (a, b, p) => a + (b - a) * p;
  const easeInOut = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
  // Colours are picked in sRGB (the palette in DESIGN.md 1) and the page renders with sRGB output and ACES tone
  // mapping, so every colour goes in linear: lin(hex) for vertex colours and uniforms; mat() does it for you.
  const lin = (hex) => new THREE.Color(hex).convertSRGBToLinear();

  // EDIT: the palette (DESIGN.md 1, picked in sRGB; mat() and lin() make them linear). ctx.C for every plug-in.
  const C = {
    grass: 0x8fb04e, meadow: 0xa6bd5c, path: 0xc2a878, sandstone: 0xd2bf92, sandShade: 0xa8946c,
    moat: 0x5d7f78, moatDeep: 0x3f5f5c, oak: 0x7a5a3a, rope: 0xc9b282, woods: 0x4c7438, woodsDark: 0x3a5d2c,
    lionBlue: 0x2f4f9a, lionGold: 0xe3b52f, bullRed: 0xb5322a, bullWhite: 0xefe9dc, hornGold: 0xd9a92c,
    steel: 0xc9d0d6, steelShade: 0x8d969e, mail: 0x8a8f92, canvas: 0xe9dfc8, smoke: 0xe6dccb, far: 0xa3a9b8,
    // base-only shades of the same family: the moat's muddy shallows, earth on steep banks, trodden grass
    mud: 0x7d7650, earth: 0x8f7a52, trodden: 0xa9ad62,
  };

  // ---------- renderer, scene, camera ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(RES);
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.96;
  renderer.shadowMap.enabled = SHADOWS;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const skyCanvas = document.createElement('canvas');
  skyCanvas.width = 4; skyCanvas.height = 512;
  const skyTex = new THREE.CanvasTexture(skyCanvas);
  skyTex.encoding = THREE.sRGBEncoding;
  function paintSky(top, mid, horizon) {
    const c2 = skyCanvas.getContext('2d');
    const g = c2.createLinearGradient(0, 0, 0, 512);
    g.addColorStop(0, top); g.addColorStop(0.18, mid); g.addColorStop(0.36, horizon); g.addColorStop(1, horizon);
    c2.fillStyle = g;
    c2.fillRect(0, 0, 4, 512);
    skyTex.needsUpdate = true;
  }
  paintSky('#4f8fd0', '#a8cdea', '#f3e2bf');
  scene.background = skyTex;
  const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.5, 900);

  // Sky-matched haze (as in Rivendell): distant things fade into the colour of the sky behind them, thicker low
  // down, warm towards the sun. Every lit material gets it (the frame loop adds it to new ones).
  const FOGU = { sky: { value: new THREE.Color() }, sunDir: { value: new THREE.Vector3(0, 0.1, -1) }, sunCol: { value: new THREE.Color() }, dens: { value: 0.0034 }, mist: { value: 0 }, mistCol: { value: new THREE.Color() } };
  THREE.ShaderChunk.fog_pars_vertex += '\n#ifdef USE_FOG\nvarying vec3 vFogWorld;\n#endif';
  THREE.ShaderChunk.fog_vertex += '\n#if defined(USE_FOG) && defined(SKY_FOG)\n#ifdef USE_INSTANCING\nvFogWorld = (modelMatrix * instanceMatrix * vec4(transformed, 1.0)).xyz;\n#else\nvFogWorld = (modelMatrix * vec4(transformed, 1.0)).xyz;\n#endif\n#endif';
  THREE.ShaderChunk.fog_pars_fragment += '\n#ifdef USE_FOG\nvarying vec3 vFogWorld;\n#ifdef SKY_FOG\nuniform vec3 uFogSky;\nuniform vec3 uSunDir;\nuniform vec3 uSunCol;\nuniform float uFogDens;\nuniform float uMistAmt;\nuniform vec3 uMistCol;\n#endif\n#endif';
  THREE.ShaderChunk.fog_fragment = [
    '#if defined(USE_FOG) && defined(SKY_FOG)',
    '  vec3 fRay = vFogWorld - cameraPosition;',
    '  float fDist = length(fRay);',
    '  vec3 fDir = fRay / fDist;',
    '  float fFar = max(fDist - 115.0, 0.0);',   // the siege itself (within about 115 m of the camera) stays crisp
    '  float fAmt = 1.0 - exp(-uFogDens * uFogDens * fFar * fFar);',
    '  fAmt *= mix(1.0, 0.55, smoothstep(2.0, 30.0, vFogWorld.y));',
    '  vec3 fCol = mix(fogColor, uFogSky, smoothstep(-0.02, 0.32, fDir.y));',
    '  fCol += uSunCol * pow(max(dot(fDir, uSunDir), 0.0), 6.0);',
    '  float fLum = dot(gl_FragColor.rgb, vec3(0.299, 0.587, 0.114));',
    '  gl_FragColor.rgb = mix(gl_FragColor.rgb, mix(vec3(fLum), fCol, 0.3), clamp(fAmt * 0.7, 0.0, 1.0));',
    '  gl_FragColor.rgb = mix(gl_FragColor.rgb, fCol, clamp(fAmt * 0.9, 0.0, 1.0));',
    // under the full night mist everything low is in it, thickening with distance even close to a camera on the ground
    // (so what is put back under the mist is never seen going, however low and close the camera is)
    '  float fMist = uMistAmt * (1.0 - smoothstep(3.5, 7.0, vFogWorld.y)) * (1.0 - exp(-fDist * 0.16));',
    '  gl_FragColor.rgb = mix(gl_FragColor.rgb, uMistCol, clamp(fMist, 0.0, 0.94));',
    '#else',
    THREE.ShaderChunk.fog_fragment,
    '#endif',
  ].join('\n');

  // ---------- helpers (plug-ins get them on ctx) ----------
  const matCache = new Map();
  function mat(color, extra) {
    const key = color + '|' + (extra ? JSON.stringify(extra) : '');
    let m = matCache.get(key);
    if (!m) {
      m = new THREE.MeshStandardMaterial(Object.assign({ flatShading: true, roughness: 0.95, metalness: 0 }, extra));
      if (color !== null && color !== undefined) m.color.copy(lin(color));
      if (extra && extra.emissive !== undefined) m.emissive.copy(lin(extra.emissive));
      matCache.set(key, m);
    }
    return m;
  }
  const basicCache = new Map();
  function basic(color) {
    let m = basicCache.get(color);
    if (!m) { m = new THREE.MeshBasicMaterial({ color: lin(color) }); basicCache.set(color, m); }
    return m;
  }
  function add(parent, geo, material, x, y, z, opt) {
    const m = new THREE.Mesh(geo, material);
    m.position.set(x || 0, y || 0, z || 0);
    if (opt) {
      if (opt.s !== undefined) { if (typeof opt.s === 'number') m.scale.setScalar(opt.s); else m.scale.set(opt.s[0], opt.s[1], opt.s[2]); }
      if (opt.r) m.rotation.set(opt.r[0], opt.r[1], opt.r[2]);
    }
    m.castShadow = SHADOWS && !(opt && opt.noShadow);
    m.receiveShadow = SHADOWS;
    parent.add(m);
    return m;
  }
  const UP = v(0, 1, 0);
  function limb(parent, a, b, ra, rb, material, segs) {
    const dir = new THREE.Vector3().subVectors(b, a), len = dir.length();
    const m = new THREE.Mesh(new THREE.CylinderGeometry(rb, ra, len, segs || 6), material);
    m.position.copy(a).add(b).multiplyScalar(0.5);
    m.quaternion.setFromUnitVectors(UP, dir.normalize());
    m.castShadow = SHADOWS; m.receiveShadow = SHADOWS;
    parent.add(m);
    return m;
  }
  function hash(x, y, z, s) { const h = Math.sin(x * 127.1 + y * 311.7 + z * 74.7 + s * 19.19) * 43758.5453; return h - Math.floor(h); }
  function jitterGeo(g, amt, seed, filter) {
    const p = g.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
      if (filter && !filter(x, y, z)) continue;
      const rx = Math.round(x * 1000) / 1000, ry = Math.round(y * 1000) / 1000, rz = Math.round(z * 1000) / 1000;
      p.setXYZ(i, x + (hash(rx, ry, rz, seed) - 0.5) * amt, y + (hash(rx, ry, rz, seed + 1) - 0.5) * amt, z + (hash(rx, ry, rz, seed + 2) - 0.5) * amt);
    }
    p.needsUpdate = true;
    g.computeVertexNormals();
    return g;
  }
  // Bake every static mesh under `group` into one mesh per material. Children with userData.dynamic are skipped.
  // Vertex colours survive the merge when every mesh of a material has them.
  function mergeGroup(group, deep) {
    group.updateMatrixWorld(true);
    const inv = new THREE.Matrix4().copy(group.matrixWorld).invert();
    const found = [];
    (function walk(o) { for (const c of o.children) { if (c.userData.dynamic) continue; if (c.isMesh && !c.isInstancedMesh && !c.isSkinnedMesh) found.push(c); else if (deep) walk(c); } })(group);
    const buckets = new Map(), tmp = new THREE.Matrix4();
    for (const m of found) {
      const src = m.geometry.index ? m.geometry.toNonIndexed() : m.geometry.clone();
      tmp.multiplyMatrices(inv, m.matrixWorld);
      src.applyMatrix4(tmp);
      if (!buckets.has(m.material)) buckets.set(m.material, []);
      buckets.get(m.material).push(src);
      m.parent.remove(m);
    }
    for (const [material, geos] of buckets) {
      let n = 0;
      const withCol = geos.every((g) => g.attributes.color);
      for (const g of geos) n += g.attributes.position.array.length;

    const now = performance.now() / 1000;

    if (ring.visible) ring.material.opacity = Math.min(1, (ringUntil - now) / 0.6) * (0.75 + 0.25 * Math.sin(now * 5));
    if (!shown || now > shownUntil) { tag.style.opacity = 0; return; }
    let p;
    try { p = shown.get(); } catch (e) { p = null; }
    const sp = p && toScreen(proj.set(p.x, p.y + (shown.person ? 0.35 : 0.6), p.z));
    if (!sp) { tag.style.opacity = 0; return; }
    tag.style.left = Math.min(innerWidth - 120, Math.max(120, sp.x)) + 'px';
    tag.style.top = Math.max(150, sp.y) + 'px';
    tag.style.opacity = now > shownUntil - 0.5 ? 0 : 1;
  }

  // ---------- the story panel (labels.js STORY): the day's chapters at the top left ----------
  // Each chapter is marked past, happening now or still to come; the ones happening now open to show their two
  // sentences and their source (at most two, the most recently started). A thin line shows how far the day has gone.
  // Tapping a chapter moves the clock to its start: everything is a function of the cycle time, so it all follows.
  // The fold button keeps just the title and the current chapter (the default on narrow screens); ?toc=0 hides it.
  const storyEl = document.getElementById('story');
  const storyItems = [];
  let storyKey = -1;
  {
    const chapters = Array.isArray(window.STORY) ? window.STORY : [];
    const list = storyEl.querySelector('ol');
    const jumpTo = (ch) => {
      clock.elapsed = Math.floor(clock.elapsed / CYCLE) * CYCLE + ch.from;
      events.active = null; events.until = 0;
    };
    for (const ch of chapters) {
      const li = document.createElement('li');
      li.className = 'future';
      li.innerHTML = '<div><div class="row"><span class="dot"></span><span class="title"></span><div class="more"><div><p class="text"></p><p class="ref"></p></div></div></div></div>';
      li.querySelector('.title').textContent = ch.title;
      li.querySelector('.text').textContent = ch.text || '';
      li.querySelector('.ref').textContent = ch.ref || '';
      li.addEventListener('click', () => jumpTo(ch));
      list.appendChild(li);
      storyItems.push({ ch, li, state: '' });
    }
    const toggle = () => storyEl.classList.toggle('closed');
    storyEl.querySelector('.fold').addEventListener('click', (e) => { e.stopPropagation(); toggle(); });
    storyEl.querySelector('.head').addEventListener('click', toggle);
    if (innerWidth < 900) storyEl.classList.add('closed');
    storyEl.hidden = params.get('toc') === '0' || !chapters.length;
  }
  const storyBar = storyEl.querySelector('.bar i');
  let storyBarK = -1, storyP = -1;
  function placeStory(t) {
    if (storyEl.hidden) return;
    const p = t % CYCLE;
    // on the first frame and after a jump (a chapter tapped, ?t0=) the chapters snap to their places instead of easing
    // open over 0.6 s, so the current chapter's sentences are never caught half shown
    const jump = storyP < 0 || (p - storyP + CYCLE) % CYCLE > 1.5;
    storyP = p;
    const bk = Math.round(p / CYCLE * 800);
    if (bk !== storyBarK) { storyBarK = bk; storyBar.style.transform = 'scaleX(' + (bk / 800).toFixed(4) + ')'; }
    // one number says which chapters are past, now or to come and which two are open; nothing changes until it does
    let key = 0, lead = null, second = null;
    for (const it of storyItems) {
      const c = it.ch, now = p >= c.from && p < c.to;
      it.state = now ? 'now' : p >= c.to ? 'past' : 'future';
      key = key * 3 + (now ? 2 : p >= c.to ? 1 : 0);
      // the two open chapters: of those happening now, the two that started last (the list keeps its order), except
      // that a chapter at its big moment (its optional `peak: [from, to]`) is always open
      if (now) {
        it.sc = c.from + (c.peak && p >= c.peak[0] && p < c.peak[1] ? 1000 : 0);
        if (!lead || it.sc >= lead.sc) { second = lead; lead = it; } else if (!second || it.sc >= second.sc) second = it;
      }
    }
    key = key * 256 + (lead ? storyItems.indexOf(lead) + 1 : 0) * 16 + (second ? storyItems.indexOf(second) + 1 : 0);
    if (key === storyKey) return;
    storyKey = key;
    if (jump) storyEl.classList.add('snap');
    for (const it of storyItems) it.li.className = it.state + (it === lead || it === second ? ' open' : '') + (it === lead ? ' lead' : '');
    if (jump) { void storyEl.offsetHeight; storyEl.classList.remove('snap'); }
  }
  window.__story = { items: storyItems, el: storyEl };

  // ---------- the frame loop ----------
  const fpsEl = document.getElementById('fps'), blurbEl = document.getElementById('blurb');
  const sunTmp = new THREE.Vector3();
  let last = performance.now(), fpsFrames = 0, fpsTime = 0, rafId = null, frameNo = 0, merged = false;
  const CAPTURE = params.has('capture');
  function frame() {
    if (!CAPTURE) rafId = requestAnimationFrame(frame);
    const now = performance.now();
    const dt = CAPTURE ? 1 / 30 : Math.min((now - last) / 1000, 0.1);
    last = now;
    clock.elapsed += dt;
    const t = clock.elapsed;
    cycle.t = t % CYCLE;
    cycle.n = Math.floor(t / CYCLE);

    // on the first frame: merge the static world (the plug-ins have built by now)
    if (!merged) {
      merged = true;
      mergeGroup(world, true);
    }

    placeCamera(t, dt);
    sky.position.copy(camera.position);
    starMat.uniforms.uTime.value = t;
    light.mist = mistAt(t);
    light.dawn = dawnAt(t);
    setLight(dayAt(t), sunAt(t, sunPos), light.dawn);
    SUN.getWorldPosition(sunTmp);
    FOGU.sunDir.value.copy(sunTmp.sub(camera.position)).normalize();

    // a blurb at the bottom of the screen while its moment lasts
    {
      const p = t % CYCLE;
      let b = 0;
      for (const B of blurbs) {
        const k = TIME === 'cycle' ? smooth01((p - B.from) / 1.2) * (1 - smooth01((p - (B.to - 1.5)) / 1.5)) : 0;
        if (k > b) { b = k; if (blurbEl.dataset.text !== B.text) { blurbEl.dataset.text = B.text; blurbEl.firstChild.textContent = B.text; blurbEl.lastChild.textContent = B.ref || ''; } }
      }
      blurbEl.style.opacity = b.toFixed(3);
    }

    // wind: a steady breeze, and a gust now and then
    windUniform.value = t;
    const gp = (t % 120 - 62) / 7;
    wind.gust = gp > 0 && gp < 1 ? Math.sin(Math.PI * gp) : 0;
    gustUniform.value = wind.gust;
    wind.strength = 0.6 + 0.6 * wind.gust;
    for (const c of clouds) { c.g.position.x += c.speed * dt; if (c.g.position.x > 280) c.g.position.x = -280; }

    // lamps: on from dusk until the morning; one lit early (ctx.lightLantern) stays on
    {
      const night = smooth01((0.75 - light.day) / 0.4), a = lanternGeo.attributes.aGlow;
      for (let i = 0; i < lanterns.length; i++) {
        const L = lanterns[i];
        if (L.litAt >= 0 && light.day > 0.95 && t - L.litAt > 60) L.litAt = -1;
        const early = L.litAt >= 0 ? smooth01((t - L.litAt) / 0.8) : 0;
        a.array[i] = Math.max(night, early) * (0.85 + 0.15 * Math.sin(t * 7 + i * 1.7));
      }
      a.needsUpdate = true;
    }

    for (const p of plugins) {
      if (p.failed || !p.update) continue;
      try { p.update(t, dt, ctx); } catch (e) { console.error('plug-in ' + p.name + ' failed', e); p.failed = true; }
    }

    // give every lit mesh material the sky haze, including ones the plug-ins create later
    if (frameNo++ % 120 === 0) scene.traverse((o) => {
      const m = o.material;
      if (!o.isMesh || !m || Array.isArray(m) || m.userData.skyFog || m.fog === false || m.isShaderMaterial || m.isMeshBasicMaterial) return;
      addSkyFog(m);
    });

    renderer.render(scene, camera);
    playCues(cycle.t);
    placeTag();
    placeStory(t);

    fpsFrames++;
    fpsTime += dt;
    if (fpsTime >= 0.5) {
      const info = renderer.info.render;
      fpsEl.textContent = Math.round(fpsFrames / fpsTime) + ' fps · ' + info.calls + ' draws · ' + (info.triangles / 1000).toFixed(1) + 'k tris · ' + cycle.t.toFixed(0) + ' s';
      fpsFrames = 0; fpsTime = 0;
    }
  }
  if (CAPTURE) window.__capture = () => { frame(); return renderer.domElement.toDataURL('image/jpeg', 0.93); };
  window.__frame = frame;
  // Start only once every plug-in's script has loaded and built: the first frame merges the static world, so a frame
  // drawn earlier (any real network) leaves the plug-ins' scenery unmerged and anything meant to be hidden showing,
  // flickering against what covers it. Headless checks step the clock after load and never see this.
  let loaded = document.readyState === 'complete';
  const start = () => { if (!CAPTURE && !document.hidden && rafId === null) { last = performance.now(); rafId = requestAnimationFrame(frame); } };
  if (!loaded) addEventListener('load', () => { loaded = true; start(); });
  document.addEventListener('visibilitychange', () => {
    if (CAPTURE) return;
    if (document.hidden) { if (rafId !== null) cancelAnimationFrame(rafId); rafId = null; }
    else if (loaded) start();
  });
  if (loaded) start();
})();
</script>
<!-- The characters (window.CHARACTERS, shared by people.js and armies.js; approved on character.html) and the scene's
     plug-ins, one file each (DESIGN.md 8). They're written in here, in this order, so that ?only= loads just the
     plug-ins asked for (the characters only with people or armies), and so that any of them can be missing: a missing
     file only logs its 404, and the page still runs with whatever is there.
       characters/lionKnight.js  characters/bullKnight.js  characters/lionArcher.js  characters/bullArcher.js
       characters/lionSpear.js   characters/bullSpear.js   characters/gunner.js      characters/engineer.js
       characters/lady.js        characters/damsel.js      characters/trumpeter.js   characters/horse.js
       characters/crow.js
       land.js  castle.js  siegeworks.js  people.js  armies.js -->
<script>
(function () {
  const q = new URLSearchParams(location.search), only = q.has('only') ? q.get('only').split(',') : null;
  const CHARACTERS = ['lionKnight', 'bullKnight', 'lionArcher', 'bullArcher', 'lionSpear', 'bullSpear', 'gunner', 'engineer', 'lady', 'damsel', 'trumpeter', 'horse', 'crow'];
  const PLUGINS = ['land', 'castle', 'siegeworks', 'people', 'armies'];
  const want = PLUGINS.filter((n) => !only || only.includes(n));
  let tags = '';
  if (want.includes('people') || want.includes('armies')) for (const c of CHARACTERS) tags += '<script src="characters/' + c + '.js"><\/script>';
  for (const n of want) tags += '<script src="' + n + '.js"><\/script>';
  document.write(tags);
})();
</script>
</body>
</html>
